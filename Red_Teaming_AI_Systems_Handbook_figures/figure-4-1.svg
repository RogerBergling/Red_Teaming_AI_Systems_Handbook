<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, sans-serif" width="700" height="300">
      <defs><marker id="a4" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7b8a9a"/></marker></defs>
      <!-- boundary -->
      <rect x="12" y="12" width="430" height="276" rx="4" fill="none" stroke="#c2410c" stroke-dasharray="5 3"/>
      <text x="22" y="26" font-size="7.4" fill="#c2410c" letter-spacing="1">ENTERPRISE TRUST BOUNDARY</text>

      <g font-size="8.2">
        <rect x="270" y="40" width="140" height="54" rx="4" fill="#0f2233" stroke="#0f2233"/>
        <text x="284" y="60" font-weight="bold" fill="#ffffff">Orchestrator</text>
        <text x="284" y="73" font-size="7.2" fill="#a9bccd">finance · email · tickets</text>
        <text x="284" y="84" font-size="7.2" fill="#a9bccd">broad tool scopes</text>

        <rect x="40" y="130" width="130" height="52" rx="4" fill="#eef4f6" stroke="#0f766e"/>
        <text x="52" y="149" font-weight="bold" fill="#0f4f4a">Research agent</text>
        <text x="52" y="161" font-size="7.2" fill="#3d5a5a">web · documents</text>
        <text x="52" y="172" font-size="7.2" fill="#3d5a5a">untrusted content</text>

        <rect x="200" y="130" width="130" height="52" rx="4" fill="#eef4f6" stroke="#0f766e"/>
        <text x="212" y="149" font-weight="bold" fill="#0f4f4a">Analysis agent</text>
        <text x="212" y="161" font-size="7.2" fill="#3d5a5a">code · data</text>
        <text x="212" y="172" font-size="7.2" fill="#3d5a5a">sandboxed runner</text>

        <rect x="330" y="210" width="100" height="56" rx="4" fill="#fdf3e7" stroke="#b45309"/>
        <text x="340" y="229" font-weight="bold" fill="#7a3a08">Writer agent</text>
        <text x="340" y="241" font-size="7.2" fill="#7a5a3a">shared memory</text>
        <text x="340" y="252" font-size="7.2" fill="#7a5a3a">outbound email</text>

        <rect x="470" y="120" width="140" height="64" rx="4" fill="#fff" stroke="#c2410c"/>
        <text x="482" y="139" font-weight="bold" fill="#a33a0c">External A2A agent</text>
        <text x="482" y="151" font-size="7.2" fill="#6b4a3a">third-party vendor</text>
        <text x="482" y="162" font-size="7.2" fill="#6b4a3a">agent card · OAuth</text>
        <text x="482" y="173" font-size="7.2" fill="#6b4a3a">unknown code &amp; model</text>

        <path d="M270 78 L150 127" stroke="#7b8a9a" marker-end="url(#a4)"/>
        <path d="M285 94 L260 127" stroke="#7b8a9a" marker-end="url(#a4)"/>
        <path d="M340 94 L375 207" stroke="#7b8a9a" marker-end="url(#a4)"/>
        <path d="M170 156 H197" stroke="#7b8a9a" marker-end="url(#a4)"/>
        <path d="M330 160 H450 V145" fill="none" stroke="#c2410c" stroke-dasharray="3 2" marker-end="url(#a4)"/>

        <circle cx="150" cy="127" r="9" fill="#b45309"/><text x="147" y="130" fill="#fff" font-size="7.5" font-weight="bold">1</text>
        <circle cx="260" cy="127" r="9" fill="#b45309"/><text x="257" y="130" fill="#fff" font-size="7.5" font-weight="bold">2</text>
        <circle cx="375" cy="207" r="9" fill="#b45309"/><text x="372" y="210" fill="#fff" font-size="7.5" font-weight="bold">3</text>
        <circle cx="450" cy="145" r="9" fill="#b45309"/><text x="447" y="148" fill="#fff" font-size="7.5" font-weight="bold">4</text>
      </g>
      <g font-size="7.4" fill="#5b6b7c">
        <text x="20" y="230" font-weight="bold" fill="#33465a">Attack paths</text>
        <text x="20" y="244">1  compromised research agent injects the orchestrator</text>
        <text x="20" y="256">2  peer message impersonates a trusted subagent</text>
        <text x="20" y="268">3  shared memory poisons the writer's future output</text>
        <text x="470" y="215" font-weight="bold" fill="#33465a">4  external</text>
        <text x="470" y="227">agent card spoof,</text>
        <text x="470" y="239">malicious artifact,</text>
        <text x="470" y="251">token replay</text>
      </g>
    </svg>

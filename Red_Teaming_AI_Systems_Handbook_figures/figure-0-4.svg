<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, sans-serif" width="700" height="250">
      <defs>
        <marker id="fw" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#0f766e"/></marker>
        <marker id="bw" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#c2410c"/></marker>
      </defs>
      <g font-size="8.4">
        <rect x="24" y="92" width="96" height="46" rx="3" fill="#eef7f5" stroke="#0f766e"/>
        <text x="38" y="111" font-weight="bold" fill="#0f4f4a">Input x</text>
        <text x="38" y="125" font-size="7.2" fill="#3d5a5a">batch × d</text>

        <rect x="166" y="92" width="110" height="46" rx="3" fill="#fdf3e7" stroke="#b45309"/>
        <text x="180" y="111" font-weight="bold" fill="#7a3a08">Layer 1</text>
        <text x="180" y="125" font-size="7.2" fill="#7a5a3a">z₁, a₁ = σ(z₁)</text>

        <rect x="322" y="92" width="110" height="46" rx="3" fill="#fdf3e7" stroke="#b45309"/>
        <text x="336" y="111" font-weight="bold" fill="#7a3a08">Layer 2</text>
        <text x="336" y="125" font-size="7.2" fill="#7a5a3a">z₂, p = softmax</text>

        <rect x="478" y="92" width="92" height="46" rx="3" fill="#eef2f6" stroke="#33465a"/>
        <text x="492" y="111" font-weight="bold" fill="#1f3244">Loss L</text>
        <text x="492" y="125" font-size="7.2" fill="#4a5a6b">−log p(y)</text>

        <path d="M120 105 H162" stroke="#0f766e" stroke-width="1.1" fill="none" marker-end="url(#fw)"/>
        <path d="M276 105 H318" stroke="#0f766e" stroke-width="1.1" fill="none" marker-end="url(#fw)"/>
        <path d="M432 105 H474" stroke="#0f766e" stroke-width="1.1" fill="none" marker-end="url(#fw)"/>
        <text x="128" y="98" font-size="7" fill="#0f766e">forward</text>

        <path d="M474 132 H438" stroke="#c2410c" stroke-width="1.1" fill="none" marker-end="url(#bw)"/>
        <path d="M318 132 H282" stroke="#c2410c" stroke-width="1.1" fill="none" marker-end="url(#bw)"/>
        <path d="M162 132 H126" stroke="#c2410c" stroke-width="1.1" fill="none" marker-end="url(#bw)"/>
        <text x="520" y="160" font-size="7" fill="#c2410c">backward: δ, gradients</text>

        <path d="M221 150 V196 H64 V144" stroke="#c2410c" stroke-width="0.8" stroke-dasharray="3 2" fill="none" marker-end="url(#bw)"/>
        <text x="88" y="210" font-size="7.2" fill="#a33a0c">∂L/∂W₁ = a₀ᵀ δ₁</text>
        <text x="330" y="210" font-size="7.2" fill="#a33a0c">δ₁ = (δ₂ W₂ᵀ) ⊙ σ′(z₁)</text>
      </g>
    </svg>

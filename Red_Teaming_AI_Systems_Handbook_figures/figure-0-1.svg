        <text x="30" y="72" font-size="7.2" fill="#3d5a5a">H — n × d</text>

        <rect x="168" y="18" width="90" height="34" rx="3" fill="#fdf3e7" stroke="#b45309"/>
        <text x="181" y="39" font-weight="bold" fill="#7a3a08">W_Q</text>
        <rect x="168" y="62" width="90" height="34" rx="3" fill="#fdf3e7" stroke="#b45309"/>
        <text x="181" y="83" font-weight="bold" fill="#7a3a08">W_K</text>
        <rect x="168" y="106" width="90" height="34" rx="3" fill="#fdf3e7" stroke="#b45309"/>
        <text x="181" y="127" font-weight="bold" fill="#7a3a08">W_V</text>

        <rect x="292" y="18" width="86" height="34" rx="3" fill="#fff" stroke="#64748b"/>
        <text x="304" y="39" fill="#33465a">Q</text>
        <rect x="292" y="62" width="86" height="34" rx="3" fill="#fff" stroke="#64748b"/>
        <text x="304" y="83" fill="#33465a">K</text>
        <rect x="292" y="106" width="86" height="34" rx="3" fill="#fff" stroke="#64748b"/>

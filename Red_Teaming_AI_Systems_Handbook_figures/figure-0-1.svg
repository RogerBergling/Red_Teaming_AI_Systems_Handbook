        <rect x="412" y="128" width="118" height="50" rx="3" fill="#eef2f6" stroke="#33465a"/>
        <text x="425" y="147" font-weight="bold" fill="#1f3244">softmax rows</text>
        <text x="425" y="161" font-size="7.2" fill="#4a5a6b">attention weights</text>

        <rect x="568" y="86" width="128" height="52" rx="3" fill="#eef7f5" stroke="#0f766e"/>

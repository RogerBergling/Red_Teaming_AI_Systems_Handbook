        <path d="M130 62 H164 M130 79 H164 M130 123 H164" stroke="#5b6b7c" fill="none" marker-end="url(#at)"/>
        <path d="M258 35 H288 M258 79 H288 M258 123 H288" stroke="#5b6b7c" fill="none" marker-end="url(#at)"/>
        <path d="M378 35 H408 V54 M378 79 H408 M378 123 H408 V122" stroke="#5b6b7c" fill="none" marker-end="url(#at)"/>

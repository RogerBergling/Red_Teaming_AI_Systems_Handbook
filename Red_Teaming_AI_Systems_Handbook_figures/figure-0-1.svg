        <text x="412" y="198" font-size="7.4" fill="#7b8a9a">Each output row is a weighted average of the value vectors.</text>
        <text x="412" y="210" font-size="7.4" fill="#7b8a9a">Causal mask: position i may only attend to j ≤ i.</text>

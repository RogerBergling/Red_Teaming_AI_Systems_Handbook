        <text x="275" y="138" font-size="6.8" fill="#7a5a3a">plan · tools</text>

        <rect x="265" y="190" width="92" height="42" rx="2" fill="#fdf3e7" stroke="#b45309"/>
        <text x="275" y="206" font-weight="bold" fill="#7a3a08">Tools</text>
        <text x="275" y="218" font-size="6.8" fill="#7a5a3a">MCP · APIs</text>

        <rect x="400" y="54" width="92" height="42" rx="2" fill="#eef4f6" stroke="#0f766e"/>

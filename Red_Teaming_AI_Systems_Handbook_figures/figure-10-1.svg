        <text x="22" y="208" font-size="6.8" fill="#6b4a3a">content publisher</text>

        <!-- processes -->
        <rect x="140" y="54" width="92" height="42" rx="2" fill="#eef4f6" stroke="#0f766e"/>
        <text x="150" y="70" font-weight="bold" fill="#0f4f4a">App / API</text>
        <text x="150" y="82" font-size="6.8" fill="#3d5a5a">auth · assembly</text>

        <rect x="265" y="40" width="92" height="40" rx="2" fill="#fdf3e7" stroke="#b45309"/>
        <text x="275" y="55" font-weight="bold" fill="#7a3a08">LLM</text>
        <text x="275" y="67" font-size="6.8" fill="#7a5a3a">inference</text>

        <rect x="265" y="110" width="92" height="42" rx="2" fill="#fdf3e7" stroke="#b45309"/>

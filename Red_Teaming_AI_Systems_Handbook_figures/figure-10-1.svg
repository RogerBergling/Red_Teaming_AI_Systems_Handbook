        <text x="590" y="94" font-size="6.8" fill="#6b4a3a">subprocessor</text>

        <rect x="580" y="190" width="108" height="52" rx="2" fill="#fff" stroke="#c2410c"/>
        <text x="590" y="206" font-weight="bold" fill="#a33a0c">External agent</text>

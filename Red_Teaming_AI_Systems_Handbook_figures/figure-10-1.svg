<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, sans-serif" width="700" height="320">
      <defs><marker id="a10" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7b8a9a"/></marker></defs>
      <!-- boundaries -->
      <rect x="120" y="30" width="440" height="250" fill="none" stroke="#c2410c" stroke-dasharray="5 3"/>
      <text x="128" y="24" font-size="7" fill="#c2410c" letter-spacing="0.8">ORGANISATION BOUNDARY</text>
      <rect x="245" y="95" width="190" height="150" fill="none" stroke="#0f766e" stroke-dasharray="4 3"/>
      <text x="253" y="90" font-size="7" fill="#0f766e" letter-spacing="0.8">AGENT RUNTIME</text>

      <g font-size="7.5">
        <!-- external -->
        <rect x="12" y="54" width="82" height="42" rx="2" fill="#fff" stroke="#64748b"/>
        <text x="22" y="70" font-weight="bold" fill="#33465a">User</text>

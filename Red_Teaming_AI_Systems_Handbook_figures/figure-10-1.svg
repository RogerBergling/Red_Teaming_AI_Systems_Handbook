        <text x="410" y="82" font-size="6.8" fill="#3d5a5a">embeddings</text>

        <rect x="400" y="120" width="92" height="42" rx="2" fill="#eef4f6" stroke="#0f766e"/>
        <text x="410" y="136" font-weight="bold" fill="#0f4f4a">Memory</text>
        <text x="410" y="148" font-size="6.8" fill="#3d5a5a">profile · history</text>

        <rect x="400" y="190" width="92" height="42" rx="2" fill="#eef4f6" stroke="#0f766e"/>
        <text x="410" y="206" font-weight="bold" fill="#0f4f4a">Data stores</text>
        <text x="410" y="218" font-size="6.8" fill="#3d5a5a">CRM · files · SQL</text>


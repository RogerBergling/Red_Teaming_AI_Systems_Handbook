          <path d="M357 131 H397" marker-end="url(#a10)"/>
          <path d="M357 211 H397" marker-end="url(#a10)"/>
          <path d="M492 75 H577" stroke-dasharray="3 2" marker-end="url(#a10)"/>
          <path d="M492 211 H577" stroke-dasharray="3 2" marker-end="url(#a10)"/>
          <path d="M94 201 C130 201 120 150 140 100" stroke="#c2410c" stroke-dasharray="2 2" marker-end="url(#a10)"/>
          <path d="M492 66 C510 66 510 120 492 135" stroke="#c2410c" stroke-dasharray="2 2" marker-end="url(#a10)"/>

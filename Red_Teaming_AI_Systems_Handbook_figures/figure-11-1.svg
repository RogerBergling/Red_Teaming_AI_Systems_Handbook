<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 210" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, sans-serif" width="700" height="210">
      <defs><marker id="a11" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#b45309"/></marker></defs>
      <g font-size="7.2">
        <line x1="30" y1="40" x2="670" y2="40" stroke="#d5dde4" stroke-width="0.8"/>
        <g fill="#0f2233">
          <text x="30" y="26" font-size="7.6" font-weight="bold">Entry</text>
          <text x="150" y="26" font-size="7.6" font-weight="bold">Content</text>
          <text x="280" y="26" font-size="7.6" font-weight="bold">Capability</text>
          <text x="410" y="26" font-size="7.6" font-weight="bold">Identity</text>
          <text x="540" y="26" font-size="7.6" font-weight="bold">Impact</text>
        </g>
        <g>
          <circle cx="30" cy="40" r="4" fill="#b45309"/>
          <circle cx="150" cy="40" r="4" fill="#b45309"/>
          <circle cx="280" cy="40" r="4" fill="#b45309"/>
          <circle cx="410" cy="40" r="4" fill="#b45309"/>
          <circle cx="540" cy="40" r="4" fill="#b45309"/>
        </g>
        <g fill="#5b6b7c">
          <text x="18" y="60">public chat</text>
          <text x="18" y="70">exposed MLflow</text>
          <text x="18" y="80">malicious PDF</text>
          <text x="138" y="60">email / document</text>
          <text x="138" y="70">agent card</text>
          <text x="138" y="80">tool output</text>
          <text x="268" y="60">RAG read</text>
          <text x="268" y="70">MCP tool</text>
          <text x="268" y="80">code interpreter</text>
          <text x="398" y="60">shared API key</text>
          <text x="398" y="70">OAuth passthrough</text>
          <text x="398" y="80">SSRF → role</text>
          <text x="528" y="60">cross-tenant data</text>
          <text x="528" y="70">ledger write</text>
          <text x="528" y="80">mailbox exfil</text>
        </g>

        <g stroke="#b45309" stroke-width="0.9" fill="none" marker-end="url(#a10)">
          <path d="M40 95 H140" marker-end="url(#a10)"/>
          <path d="M160 95 H270" marker-end="url(#a10)"/>
          <path d="M290 95 H400" marker-end="url(#a10)"/>
          <path d="M420 95 H530" marker-end="url(#a10)"/>
        </g>
        <g fill="#7b8a9a" font-size="6.6">
          <text x="70" y="110">plant or persuade</text>
          <text x="190" y="110">tool / retrieval abuse</text>
          <text x="320" y="110">delegate or steal</text>
          <text x="450" y="110">act as the principal</text>
        </g>

        <rect x="20" y="132" width="660" height="64" rx="3" fill="#f7f8fa" stroke="#dde3e9"/>
        <text x="32" y="148" font-size="7.4" font-weight="bold" fill="#33465a">Objective chain</text>
        <text x="32" y="162" font-size="7.2" fill="#5b6b7c">A credible capstone demonstrates one end-to-end chain, for example: malicious supplier PDF →</text>
        <text x="32" y="175" font-size="7.2" fill="#5b6b7c">extraction pipeline → poisoned policy chunk → claims agent → payment agent → ledger entry.</text>
        <text x="32" y="188" font-size="7.2" fill="#5b6b7c">Each hop must be evidenced, reproducible and reversible; a demo is not a finding.</text>
      </g>
    </svg>

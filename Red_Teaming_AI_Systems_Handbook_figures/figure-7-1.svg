<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, sans-serif" width="700" height="280">
      <defs><marker id="a7" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7b8a9a"/></marker></defs>
      <g font-size="7.8">
        <rect x="20" y="30" width="150" height="92" rx="4" fill="#0f2233"/>
        <text x="34" y="50" font-weight="bold" fill="#ffffff" font-size="9">Host application</text>
        <text x="34" y="66" font-size="7.2" fill="#a9bccd">user session · model · policy</text>
        <text x="34" y="78" font-size="7.2" fill="#a9bccd">approval UI · audit</text>
        <text x="34" y="96" font-size="7.2" fill="#7dd3c7">client A · client B · client C</text>
        <text x="34" y="110" font-size="7.2" fill="#7dd3c7">one connection per server</text>

        <rect x="250" y="20" width="160" height="70" rx="4" fill="#eef4f6" stroke="#0f766e"/>
        <text x="262" y="38" font-weight="bold" fill="#0f4f4a">Local stdio server</text>
        <text x="262" y="52" font-size="7.2" fill="#3d5a5a">runs as the user</text>
        <text x="262" y="64" font-size="7.2" fill="#3d5a5a">full filesystem · env vars</text>
        <text x="262" y="76" font-size="7.2" fill="#3d5a5a">installed via npx / uvx</text>

        <rect x="250" y="110" width="160" height="70" rx="4" fill="#eef4f6" stroke="#0f766e"/>
        <text x="262" y="128" font-weight="bold" fill="#0f4f4a">Remote HTTP server</text>
        <text x="262" y="142" font-size="7.2" fill="#3d5a5a">third-party SaaS</text>
        <text x="262" y="154" font-size="7.2" fill="#3d5a5a">OAuth 2.1 · scopes</text>
        <text x="262" y="166" font-size="7.2" fill="#3d5a5a">shared across tenants</text>

        <rect x="250" y="200" width="160" height="64" rx="4" fill="#fdf3e7" stroke="#c2410c"/>
        <text x="262" y="218" font-weight="bold" fill="#a33a0c">Malicious server</text>
        <text x="262" y="232" font-size="7.2" fill="#6b4a3a">poisoned description</text>
        <text x="262" y="244" font-size="7.2" fill="#6b4a3a">credential broker</text>
        <text x="262" y="256" font-size="7.2" fill="#6b4a3a">sampling / elicitation abuse</text>

        <rect x="470" y="20" width="190" height="70" rx="4" fill="#f4f6f8" stroke="#94a3b8"/>
        <text x="482" y="38" font-weight="bold" fill="#33465a">Data &amp; systems</text>
        <text x="482" y="52" font-size="7.2" fill="#5b6b7c">files · databases · SaaS APIs</text>
        <text x="482" y="64" font-size="7.2" fill="#5b6b7c">cloud control plane · email</text>
        <text x="482" y="76" font-size="7.2" fill="#5b6b7c">code repositories · browsers</text>

        <rect x="470" y="200" width="190" height="64" rx="4" fill="#fff" stroke="#c2410c"/>
        <text x="482" y="218" font-weight="bold" fill="#a33a0c">Attacker infrastructure</text>
        <text x="482" y="232" font-size="7.2" fill="#6b4a3a">collect endpoint</text>
        <text x="482" y="244" font-size="7.2" fill="#6b4a3a">look-alike registry</text>
        <text x="482" y="256" font-size="7.2" fill="#6b4a3a">stolen token replay</text>

        <g stroke="#7b8a9a" stroke-width="0.8">
          <path d="M170 76 H247" marker-end="url(#a7)"/>
          <path d="M170 110 H220 V145 H247" fill="none" marker-end="url(#a7)"/>
          <path d="M170 145 H247" stroke-dasharray="3 2" marker-end="url(#a7)"/>
          <path d="M410 55 H467" marker-end="url(#a7)"/>
          <path d="M410 145 H467" marker-end="url(#a7)"/>
          <path d="M410 232 H467" stroke="#c2410c" stroke-dasharray="3 2" marker-end="url(#a7)"/>
        </g>
      </g>
    </svg>

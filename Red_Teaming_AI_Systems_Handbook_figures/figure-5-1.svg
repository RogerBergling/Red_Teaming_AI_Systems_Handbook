<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, sans-serif" width="700" height="250">
      <defs><marker id="a5" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#7b8a9a"/></marker></defs>
      <g font-size="7.8">
        <rect x="10" y="70" width="88" height="56" rx="3" fill="#f4f6f8" stroke="#94a3b8"/>
        <text x="20" y="88" font-weight="bold" fill="#33465a">Sources</text>
        <text x="20" y="101" font-size="7" fill="#5b6b7c">wiki · drive · email</text>
        <text x="20" y="112" font-size="7" fill="#5b6b7c">web · tickets · PDFs</text>

        <rect x="118" y="70" width="84" height="56" rx="3" fill="#f4f6f8" stroke="#94a3b8"/>
        <text x="128" y="88" font-weight="bold" fill="#33465a">Parse</text>
        <text x="128" y="101" font-size="7" fill="#5b6b7c">text, tables, OCR</text>
        <text x="128" y="112" font-size="7" fill="#5b6b7c">metadata, ACLs</text>

        <rect x="222" y="70" width="84" height="56" rx="3" fill="#f4f6f8" stroke="#94a3b8"/>
        <text x="232" y="88" font-weight="bold" fill="#33465a">Chunk &amp; embed</text>
        <text x="232" y="101" font-size="7" fill="#5b6b7c">split, overlap</text>
        <text x="232" y="112" font-size="7" fill="#5b6b7c">vectors, metadata</text>

        <rect x="326" y="70" width="84" height="56" rx="3" fill="#eef4f6" stroke="#0f766e"/>
        <text x="336" y="88" font-weight="bold" fill="#0f4f4a">Index</text>
        <text x="336" y="101" font-size="7" fill="#3d5a5a">HNSW / IVF</text>
        <text x="336" y="112" font-size="7" fill="#3d5a5a">hybrid, filters</text>

        <rect x="430" y="70" width="84" height="56" rx="3" fill="#fdf3e7" stroke="#b45309"/>
        <text x="440" y="88" font-weight="bold" fill="#7a3a08">Retrieve</text>
        <text x="440" y="101" font-size="7" fill="#7a5a3a">top-k, rewrite</text>
        <text x="440" y="112" font-size="7" fill="#7a5a3a">rerank, filter</text>

        <rect x="534" y="70" width="76" height="56" rx="3" fill="#fdf3e7" stroke="#b45309"/>
        <text x="544" y="88" font-weight="bold" fill="#7a3a08">Assemble</text>
        <text x="544" y="101" font-size="7" fill="#7a5a3a">delimit</text>
        <text x="544" y="112" font-size="7" fill="#7a5a3a">cite</text>

        <rect x="630" y="70" width="60" height="56" rx="3" fill="#0f2233" stroke="#0f2233"/>
        <text x="639" y="88" font-weight="bold" fill="#ffffff">Generate</text>
        <text x="639" y="101" font-size="7" fill="#a9bccd">answer +</text>
        <text x="639" y="112" font-size="7" fill="#a9bccd">citations</text>

        <g stroke="#7b8a9a" stroke-width="0.8">
          <path d="M98 98 H115" marker-end="url(#a5)"/>
          <path d="M202 98 H219" marker-end="url(#a5)"/>
          <path d="M306 98 H323" marker-end="url(#a5)"/>
          <path d="M410 98 H427" marker-end="url(#a5)"/>
          <path d="M514 98 H531" marker-end="url(#a5)"/>
          <path d="M610 98 H627" marker-end="url(#a5)"/>
        </g>

        <g fill="#b45309" font-size="8" font-weight="bold">
          <circle cx="54" cy="62" r="8"/><text x="51" y="65" fill="#fff">1</text>
          <circle cx="160" cy="62" r="8"/><text x="157" y="65" fill="#fff">2</text>
          <circle cx="264" cy="62" r="8"/><text x="261" y="65" fill="#fff">3</text>
          <circle cx="472" cy="62" r="8"/><text x="469" y="65" fill="#fff">4</text>
          <circle cx="572" cy="62" r="8"/><text x="569" y="65" fill="#fff">5</text>
        </g>
        <text x="10" y="150" font-size="7.2" fill="#5b6b7c">
          <tspan x="10" dy="0" font-weight="bold" fill="#33465a">Attack surface</tspan>
          <tspan x="10" dy="13">1  source injection, connector over-permission</tspan>
          <tspan x="10" dy="11">2  parser confusion, hidden text, metadata</tspan>
          <tspan x="10" dy="11">3  chunk boundary leakage, embedding manipulation</tspan>
          <tspan x="10" dy="11">4  ranking manipulation, filter injection, top-k starvation</tspan>
          <tspan x="10" dy="11">5  context flooding, citation spoofing, instruction smuggling</tspan>
        </text>

        <rect x="370" y="140" width="320" height="86" rx="3" fill="#f7f8fa" stroke="#dde3e9"/>
        <text x="382" y="156" font-size="7.2" font-weight="bold" fill="#33465a">Where it fails</text>
        <text x="382" y="170" font-size="7.2" fill="#5b6b7c">Ingestion has no trust review; ACLs are copied once and never updated;</text>
        <text x="382" y="182" font-size="7.2" fill="#5b6b7c">retrieval runs as a service account; metadata filters are built by string</text>
        <text x="382" y="194" font-size="7.2" fill="#5b6b7c">concatenation; the prompt treats retrieved text as instructions; citations</text>
        <text x="382" y="206" font-size="7.2" fill="#5b6b7c">are generated by the model rather than derived from metadata.</text>
      </g>
    </svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Liberation Sans, sans-serif" width="700" height="340">
      <defs><marker id="a3" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6b7c"/></marker></defs>
      <g font-size="8.6">
        <!-- loop -->
        <rect x="250" y="20" width="200" height="46" rx="4" fill="#eef4f6" stroke="#0f766e"/>
        <text x="265" y="39" font-weight="bold" fill="#0f4f4a">Context assembly</text>
        <text x="265" y="52" font-size="7.3" fill="#3d5a5a">policy · history · memory · docs · tools</text>

        <rect x="250" y="106" width="200" height="46" rx="4" fill="#fdf3e7" stroke="#b45309"/>
        <text x="265" y="125" font-weight="bold" fill="#7a3a08">Model decision</text>
        <text x="265" y="138" font-size="7.3" fill="#7a5a3a">plan, respond, or call a tool</text>

        <rect x="250" y="192" width="200" height="46" rx="4" fill="#fdf3e7" stroke="#b45309"/>
        <text x="265" y="211" font-weight="bold" fill="#7a3a08">Tool execution</text>
        <text x="265" y="224" font-size="7.3" fill="#7a5a3a">API · file · shell · browser · MCP</text>

        <rect x="250" y="278" width="200" height="46" rx="4" fill="#eef4f6" stroke="#0f766e"/>
        <text x="265" y="297" font-weight="bold" fill="#0f4f4a">Observation &amp; state update</text>
        <text x="265" y="310" font-size="7.3" fill="#3d5a5a">result appended · memory written</text>

        <path d="M350 66 V103" stroke="#5b6b7c" stroke-width="1" marker-end="url(#a3)"/>
        <path d="M350 152 V189" stroke="#5b6b7c" stroke-width="1" marker-end="url(#a3)"/>
        <path d="M350 238 V275" stroke="#5b6b7c" stroke-width="1" marker-end="url(#a3)"/>
        <path d="M450 301 H520 V43 H453" fill="none" stroke="#5b6b7c" stroke-width="1" marker-end="url(#a3)"/>
        <text x="528" y="176" font-size="7.2" fill="#7b8a9a" transform="rotate(90 528 176)">loop until stop condition</text>

        <!-- inputs -->
        <rect x="30" y="20" width="175" height="46" rx="4" fill="#fff" stroke="#c2410c"/>
        <text x="42" y="39" font-weight="bold" fill="#a33a0c">User / API client</text>
        <text x="42" y="52" font-size="7.3" fill="#6b4a3a">direct instructions, uploaded files</text>
        <path d="M205 43 H247" stroke="#c2410c" marker-end="url(#a3)"/>

        <rect x="30" y="106" width="175" height="46" rx="4" fill="#fff" stroke="#c2410c"/>
        <text x="42" y="125" font-weight="bold" fill="#a33a0c">Retrieved content</text>
        <text x="42" y="138" font-size="7.3" fill="#6b4a3a">web, email, tickets, documents</text>
        <path d="M205 129 H247" stroke="#c2410c" marker-end="url(#a3)"/>

        <rect x="30" y="192" width="175" height="46" rx="4" fill="#fff" stroke="#c2410c"/>
        <text x="42" y="211" font-weight="bold" fill="#a33a0c">Memory store</text>
        <text x="42" y="224" font-size="7.3" fill="#6b4a3a">long-term profile, summaries</text>
        <path d="M205 215 H247" stroke="#c2410c" marker-end="url(#a3)"/>

        <rect x="30" y="278" width="175" height="46" rx="4" fill="#fff" stroke="#c2410c"/>
        <text x="42" y="297" font-weight="bold" fill="#a33a0c">Tool output</text>
        <text x="42" y="310" font-size="7.3" fill="#6b4a3a">third-party servers, parsed files</text>
        <path d="M205 301 H247" stroke="#c2410c" marker-end="url(#a3)"/>

        <!-- outputs -->
        <rect x="530" y="240" width="145" height="52" rx="4" fill="#fff" stroke="#64748b"/>
        <text x="542" y="258" font-weight="bold" fill="#33465a">External effect</text>
        <text x="542" y="271" font-size="7.3" fill="#4a5a6b">email, payment, record write,</text>
        <text x="542" y="282" font-size="7.3" fill="#4a5a6b">code commit, network fetch</text>
        <path d="M450 215 H505 V248 H527" fill="none" stroke="#64748b" marker-end="url(#a3)"/>

        <!-- numbered markers -->
        <g fill="#b45309" font-size="7.5" font-weight="bold">
          <circle cx="222" cy="16" r="7" fill="#b45309"/><text x="219.6" y="18.6" fill="#fff">1</text>
          <circle cx="222" cy="102" r="7" fill="#b45309"/><text x="219.6" y="104.6" fill="#fff">2</text>
          <circle cx="222" cy="188" r="7" fill="#b45309"/><text x="219.6" y="190.6" fill="#fff">3</text>
          <circle cx="222" cy="274" r="7" fill="#b45309"/><text x="219.6" y="276.6" fill="#fff">4</text>
          <circle cx="350" cy="168" r="7" fill="#b45309"/><text x="346" y="170.6" fill="#fff">5</text>
          <circle cx="468" cy="236" r="7" fill="#b45309"/><text x="464" y="238.6" fill="#fff">6</text>
        </g>
      </g>
    </svg>
